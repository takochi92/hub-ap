<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude 司令塔</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="claude.css?v=9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="cyber.css?v=9">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""><div>Claude 司令塔<small>TASKS · BUILDS · TWEETS</small></div></div>
    <span class="spacer"></span>
    <span class="live" id="updated">読み込み中…</span>
    <button class="pill-btn" type="button" onclick="location.reload()">↻ 更新</button>
  </header>

  <section class="hero">
    <div class="eyebrow" id="hero-date">TODAY</div>
    <h1 id="hero-title">読み込み中…</h1>
    <p id="hero-sub"></p>
    <div class="hero-stats">
      <div class="hs coral"><b id="s-today">–</b><span>今日の作業</span></div>
      <div class="hs cyan"><b id="s-created">–</b><span>今日つくったファイル</span></div>
      <div class="hs amber"><b id="s-tweets">–</b><span>投稿待ちツイート</span></div>
      <div class="hs violet"><b id="s-tasks">–</b><span>進行中・たこさん待ち</span></div>
    </div>
  </section>

  <div class="mailbar" id="mailbar" hidden></div>

  <div class="filters" id="projects" role="group" aria-label="プロジェクト"></div>

  <div class="grid">
    <section class="card span-2">
      <h2>✅ タスク <span class="count" id="tasks-count"></span></h2>
      <div class="tasks" id="tasks"></div>
    </section>

    <section class="card span-2" id="posts-card">
      <h2>📅 投稿予定 <span class="count" id="posts-count"></span></h2>
      <div class="posts" id="posts"></div>
    </section>

    <section class="card span-2">
      <h2>🐦 ツイート <span class="count" id="tweets-count"></span></h2>
      <div class="tweets" id="tweets"></div>
    </section>

    <section class="card">
      <h2>🔥 Activity <span class="count">直近12週</span></h2>
      <div class="heat" id="heat"></div>
      <div class="heat-legend"><span id="heat-from"></span><span>少 ▢▣■ 多</span><span>今日</span></div>
    </section>

    <section class="card">
      <h2>🧩 プロジェクト別 <span class="count" id="streak"></span></h2>
      <div class="bars" id="bars"></div>
    </section>

    <section class="card span-2">
      <h2>🗓 つくったもの <span class="count" id="tl-count"></span></h2>
      <div id="timeline"></div>
    </section>
  </div>

  <p class="foot"><span id="foot"></span><br><button class="linkish" type="button" onclick="HubLog.forget()">合い鍵をこのスマホから消す</button></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="token-box" id="token-box" hidden>
  <form class="token-card" id="token-form">
    <img src="icon.svg" alt="" width="48" height="48">
    <h2>合い鍵を入れてください</h2>
    <p>GitHub で作った「見るだけの合い鍵」（github_pat_ で始まる文字）を貼り付けます。このスマホの中にだけ保存されます。</p>
    <p class="token-msg" id="token-msg"></p>
    <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="合い鍵">
    <button class="pill-btn x" type="submit">保存して開く</button>
  </form>
</div>

<script src="data.js?v=9"></script>
<script src="app.js?v=9"></script>
<script src="fx.js?v=9"></script>
</body>
</html>
